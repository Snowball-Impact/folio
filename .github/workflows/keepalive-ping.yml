name: Ping Streamlit App

on:
  schedule:
    # Every 30 minutes from KST 07:00 to 00:30.
    - cron: "*/30 0-15,22-23 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping public app
        run: |
          python - <<'PY'
          from __future__ import annotations

          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          URLS = (
              # The public root can return a 303 redirect loop to non-browser clients.
              # The embedded app route is the Streamlit runtime frame and responds
              # reliably to lightweight keepalive requests.
              "https://folio-gapyear.streamlit.app/~/+/",
          )

          for url in URLS:
              target = f"{url}?_keepalive={int(time.time())}"
              request = Request(
                  target,
                  headers={
                      "User-Agent": "folio-keepalive/1.0",
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )
              try:
                  with urlopen(request, timeout=60) as response:
                      body = response.read(4096).decode("utf-8", errors="ignore")
                      print(f"{response.status} {target}")
                      if "Yes, get this app back up!" in body:
                          print("Streamlit sleep prompt detected; daily browser wake workflow should handle it.")
              except HTTPError as exc:
                  print(f"HTTP {exc.code} {target}")
                  raise
              except URLError as exc:
                  print(f"Network error for {target}: {exc}")
                  raise
          PY
