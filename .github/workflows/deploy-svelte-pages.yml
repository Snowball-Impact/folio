name: Deploy Svelte (Cloudflare Pages)

on:
  push:
    branches:
      - main

jobs:
  deploy-pages:
    name: Build and deploy Svelte app to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./svelte_app
        run: npm ci

      - name: Build Svelte app
        working-directory: ./svelte_app
        run: npm run build

      - name: Deploy to Cloudflare Pages (wrangler)
        working-directory: ./svelte_app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler@4
          npx wrangler pages deploy .svelte-kit/cloudflare --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
