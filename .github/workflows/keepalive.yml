name: Keep Streamlit App Awake

on:
  schedule:
    # KST 00:00, 06:00, 12:00, 18:00
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            --output /dev/null \
            "https://folio-gapyear.streamlit.app"
