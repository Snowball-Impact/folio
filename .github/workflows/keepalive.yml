name: Keep Streamlit App Awake

on:
  schedule:
    # 매일 KST 08:00 = UTC 23:00
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            --output /dev/null \
            "https://folio-gapyear.streamlit.app"
