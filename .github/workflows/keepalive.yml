name: Keep Streamlit App Awake

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --max-time 60 --retry 3 --retry-delay 10 \
            "https://folio.streamlit.app/?page=Home"
