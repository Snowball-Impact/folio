name: Keep Streamlit App Awake

on:
  schedule:
    # 매일 KST 20:00
    # GitHub Actions cron은 UTC 기준 → KST 20:00 = UTC 11:00
    - cron: "0 11 * * *"

  # 필요할 때 수동 실행 가능
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            --output /dev/null \
            "https://folio-gapyear.streamlit.app"
