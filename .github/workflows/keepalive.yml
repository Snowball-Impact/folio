name: Wake Streamlit App

on:
  schedule:
    # 매일 KST 오전 8시
    - cron: "45 22 * * *"

  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Wake Streamlit app
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://folio-gapyear.streamlit.app"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page()

              print("Opening app...")
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              page.wait_for_timeout(5000)

              # Streamlit 앱이 sleep 상태인지 확인
              wake_button = page.get_by_text(
                  "Yes, get this app back up!",
                  exact=False
              )

              if wake_button.count() > 0:
                  print("App is sleeping. Waking up...")

                  wake_button.first.click()

                  # Streamlit 서버가 다시 올라올 때까지 대기
                  page.wait_for_timeout(60000)

                  print("Wake request completed.")

              else:
                  print("App is already awake.")

              print("Current URL:", page.url)
              print("Title:", page.title())

              browser.close()
          PY
