name: Keep Streamlit App Awake

on:
  schedule:
    # KST 07:00, 19:00 (12시간 간격)
    # GitHub Actions cron은 UTC 기준
    - cron: "0 10,22 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            --output /dev/null \
            "https://folio-gapyear.streamlit.app"
